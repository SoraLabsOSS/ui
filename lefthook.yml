pre-commit:
  jobs:
    - run: bun x ultracite fix || true
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true
    - run: bun run --cwd apps/www lint:links
      glob:
        - "apps/www/content/**"

pre-push:
  jobs:
    - run: bun run build