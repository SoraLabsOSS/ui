name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check-types

      - name: Validate doc links
        run: bun run lint:links

      - name: Run CLI tests
        run: bun run test:www-cli

      - name: Verify registry sync
        id: registry-sync
        run: |
          bun run registry:build
          # If there is any diff, emit a warning but do not fail the job
          if ! git diff --quiet apps/www/__registry__ apps/www/public/r; then
            echo "::warning file=apps/www/__registry__::Registry files differ – review the changes"
          fi
